# The fetch eval's target set. Each entry names what it is meant to expose, so a
# result that looks wrong can be read against the reason the URL is here.
#
# kind:  hk-news | hk-gov | mainland | js-heavy | pdf | control | wall
# Landing pages are preferred over articles: article URLs rot, and a 404 six
# months from now would read as a cascade failure.

- id: hko-9day
  url: https://www.hko.gov.hk/en/wxinfo/currwx/fnd.htm
  kind: hk-gov
  note: Values written in by JavaScript. Layer 1 returns the skeleton with {0} slots.

- id: hko-flw-tc
  url: https://www.hko.gov.hk/tc/wxinfo/currwx/flw.htm
  kind: hk-gov
  note: Current weather in Chinese, same site, shorter page.

- id: info-gov-hk
  url: https://www.info.gov.hk/gia/general/today.htm
