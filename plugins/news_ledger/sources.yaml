# The whole of cs.CL and cs.IR, about 410 papers a day. Never offered: they are
# the control the eval measures the arXiv topic queries against, to see what
# keyword search misses.
- id: arxiv-cs-cl
  family: arxiv
  control: true
  bucket: applied
  kind: feed
  url: https://rss.arxiv.org/rss/cs.CL

- id: arxiv-cs-ir
  family: arxiv
  control: true
  bucket: applied
  kind: feed
  url: https://rss.arxiv.org/rss/cs.IR

- id: docling-releases
  label: Docling
  latest_only: true
  bucket: applied
