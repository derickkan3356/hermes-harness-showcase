# Master CV: every true fact, written by the user. The `cv` plugin reads it;
# the agent picks and phrases facts from it per job, and cites fact ids.
#
# This copy is a fictional example: the person, companies and projects are made up.
# It has the same shape as the real one, so the plugin runs on it.
#
# - A fact is one true claim, as specific as possible: numbers, tools, scale.
#   Not a CV sentence. The agent writes the sentence.
# - Fact ids are unique across the whole file and never reused. Prefix = project id.
# - Company, title, dates, education and contact are printed from here by id;
#   the model never writes them.
# - `seeds` (optional, per project): your own phrasing for one angle, or a short
#   note on how to frame the project. The agent follows them.

