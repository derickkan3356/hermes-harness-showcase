# ---------------------------------------------------------------- projects
# client: a general description. Client names never go on the CV or in this file.

projects:

  - id: kb-assistant
    role: harbourtech
    name: Internal knowledge assistant
    client: Harbour Tech (internal)
    from: 2025-09
    to: null
    my_role: technical owner
    facts:
      - id: kb-assistant.scope
        text: Rolled out to about 40 staff as the approved place to ask questions about internal policies and project documents.
      - id: kb-assistant.rag
        text: Built retrieval-augmented generation over 3,000 internal documents with PostgreSQL and pgvector.
      - id: kb-assistant.local
        text: Serves an open-weight LLM on a company GPU server, so no document leaves the company network.
      - id: kb-assistant.eval
        text: Wrote an evaluation set of 50 questions with reference answers and ran it before every model or prompt change.
      - id: kb-assistant.citations
        text: Every answer cites the documents it used; an answer with no retrieved source says so instead of guessing.
    seeds:
      - "Lead with the data staying in house, not with the model."

  - id: invoice-ocr
    role: harbourtech
    name: Invoice data extraction
    client: a Hong Kong trading company
    from: 2024-09
    to: 2025-04
    my_role: sole engineer
    facts:
      - id: invoice-ocr.what
        text: Extracted supplier, date, line items and totals from scanned invoices into the client's ERP.
      - id: invoice-ocr.stack
        text: Used Azure AI Document Intelligence for layout and an LLM for fields the layout model missed.
      - id: invoice-ocr.check
        text: Checked that line items add up to the invoice total in code, and sent invoices that did not to a person.
      - id: invoice-ocr.result
        text: Cut manual entry from about 6 minutes to under 1 minute per invoice on a test set of 200 invoices.
    seeds: []

  - id: volume-forecast
    role: kowloonlogistics
    name: Warehouse volume forecast
    from: 2023-01
    to: 2024-02
    facts:
      - id: volume-forecast.model
        text: Built a weekly volume forecast per warehouse with LightGBM on two years of shipment data.
      - id: volume-forecast.result
        text: Lowered forecast error (MAPE) from 18% to 11% against the spreadsheet method it replaced.
      - id: volume-forecast.report
        text: Published the forecast to a Power BI report the operations team used for weekly staffing.
    seeds: []

  - id: hermes-harness
