- id: ollama-blog
  bucket: open-weights
  kind: feed
  url: https://ollama.com/blog/rss.xml

# --- standing in for a lab that publishes no feed ----------------------------
#
# Anthropic, Meta AI and Mistral declare no feed, and Qwen's is dead. These two
# kinds cover that hole from opposite sides, and both are measured this week
# before either is trusted.

# What a lab ships, from its own HuggingFace account. Real URL, real timestamp,
# and downloads and likes to rank on. Blind to any lab that ships no weights.
- id: hf-model-releases
  bucket: models
  kind: hf_models
  limit: 20
  authors:
    - Qwen
    - deepseek-ai
    - mistralai
    - zai-org
    - moonshotai
    - meta-llama
    - openai
    - google
    - microsoft
    - nvidia

# Headlines from a lab's own site, by way of Google News. `site` may carry a
# path: bare `mistral.ai` returns its documentation pages as news. The date is exact and
# the headline is real. The link is a Google-encoded redirect that only a browser
# follows — `web_extract` reads it through the cascade's browser layer, plain HTTP
# gets Google's page — and it is not the article's URL, so `opaque_url` keeps it
# out of URL dedup.
- id: gnews-anthropic
  bucket: models
  kind: gnews
  site: anthropic.com
  opaque_url: true

- id: gnews-meta-ai
  bucket: models
  kind: gnews
  site: ai.meta.com
  opaque_url: true

- id: gnews-mistral
  bucket: models
  kind: gnews
  site: mistral.ai/news
  opaque_url: true

# An edited tech-news aggregator. Real links, and it carries provider news that
# never reaches Hacker News.
- id: techmeme
  bucket: models
  kind: feed
  url: https://www.techmeme.com/feed.xml
  min_relevance: 0.56

# --- arXiv by topic ----------------------------------------------------------
#
# The applied bucket is two topics, not a field. `cat:cs.CL` announces about 355
# papers a day and cs.IR another 55; these queries return one or two. Same API,
# no key, and `published` here is the paper's own submission date rather than the
# day's announcement batch.
- id: arxiv-text2sql
  family: arxiv
  dated_by: first_seen
  bucket: applied
  kind: arxiv_query
  query: 'abs:"text-to-SQL" OR abs:"NL2SQL" OR abs:"database agent"'

- id: arxiv-docai
  family: arxiv
  dated_by: first_seen
  bucket: applied
  kind: arxiv_query
  query: 'abs:"document understanding" OR abs:"document AI" OR abs:"OCR"'

- id: arxiv-agents
  family: arxiv
  dated_by: first_seen
  bucket: agent-eng
  kind: arxiv_query
  query: 'abs:"context engineering" OR abs:"agent harness" OR abs:"tool use" OR abs:"Model Context Protocol"'
