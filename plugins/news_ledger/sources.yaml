# The sources the AI news digest reads, and the table `evals/feeds` measures.
#
# Every URL here answered 200 with parsable items from this machine, with the
# proxy unset. None needs an API key, and none may grow one without saying so in
# docs/ai-news.md.
#
# kind:
#   feed         RSS or Atom
#   algolia      Hacker News search, official API, one call per `query`
#   hf           HuggingFace daily papers
#   hf_models    what each of `authors` uploaded to HuggingFace
#   gnews        Google News restricted to `site` (links are Google redirects)
#   arxiv_query  arXiv API field search
#
# bucket   the routing label (docs/ai-news.md, Buckets), not a quota
# family   sources with one publisher share a family and count as one witness
#          when a story's corroboration is counted; defaults to the id
# control  measured by the eval, never offered to the digest
# label    prefixed to titles that do not name their project: a release feed's
#          titles are bare tags like `b11122`
# latest_only  the digest keeps only this source's newest item in the window:
#          llama.cpp tags several builds a day, and each is not news
# min_relevance  a story carried only by sources with a floor must reach the
#          lowest of them (`passes` in workers/news.py). Set on wide-net sources
#          only, from labelled data: `uv run evals/relevance/relevance_eval.py
#          report`. Each sits where about 5% of the source's on-topic stories
#          are lost. A curated source gets none: its titles score low for lack
#          of words, not of relevance.
# dated_by: first_seen  the digest's period holds this source's items by when
#          the ledger first saw them, not by `published` (`in_period` in
#          workers/news.py): arXiv's date is the submission, and the paper is
#          readable only from the next announcement, often more than a day later
- id: openai-news
  bucket: models
  kind: feed
  url: https://openai.com/news/rss.xml

- id: deepmind-blog
  bucket: models
  kind: feed
  url: https://deepmind.google/blog/rss.xml

- id: google-research
  bucket: models
  kind: feed
  url: https://research.google/blog/rss/

- id: hf-blog
  bucket: models
  kind: feed
  url: https://huggingface.co/blog/feed.xml

# Qwen's feed answers 200 but stopped at Qwen3Guard in September 2025 — the blog
# moved to qwen.ai, which serves its posts from JavaScript and declares no feed.
# Kept so a restart is picked up; it contributes nothing meanwhile.
