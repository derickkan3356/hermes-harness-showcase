# Search eval query set: Hong Kong, mainland China, Japan.
#
# Two kinds of query:
#   local      The text itself points at one region (place name, script, local term).
#              Run once. Scored against `region`.
#   ambiguous  No place in the text. Run once per region in `regions`, with that
#              region's parameters (ddgs code, google gl/hl for serper and scrappa, brave country[/search_lang]). Scored against the region under test.
#              This is the set that shows whether a region parameter does anything.
#
# Scoring: a result URL is "in region" when its hostname ends with one of that
# region's `domains` entries. A query hits when at least one of the top 5 URLs is
# in region. Also record the in-region share of the top 5, and 0-hit results.
#
# Tags: gov, news, transport, finance, food, shopping, tech, travel, weather,
# colloquial (spoken or informal wording), time (answer changes over time),
# operator (query uses site: or similar).

regions:
  hk:
    ddgs: hk-tzh
    google: {gl: hk, hl: zh}  # scrappa takes 2-letter hl only
    brave: {country: HK}
    place: 香港  # brave-rewrite puts this in front of the query
    brave_lang: {country: HK, search_lang: zh-hant}
    domains: [.hk, hk01.com, scmp.com, mingpao.com, on.cc, stheadline.com, hkej.com, hket.com, openrice.com, hkgolden.com, lihkg.com, discuss.com.hk, 28hse.com, centaline.com.hk]
  cn:
    ddgs: cn-zh
    google: {gl: cn, hl: zh}
    brave: {country: CN}
    place: 中国  # brave-rewrite puts this in front of the query
    brave_lang: {country: CN, search_lang: zh-hans}
    domains: [.cn, baidu.com, zhihu.com, qq.com, sohu.com, 163.com, sina.com, weibo.com, bilibili.com, douban.com, csdn.net, ctrip.com, dianping.com, jd.com, taobao.com, tmall.com, xiaohongshu.com, toutiao.com, ithome.com, 36kr.com, dongchedi.com, autohome.com]
  jp:
    ddgs: jp-jp
    google: {gl: jp, hl: ja}
    brave: {country: JP}
    place: 日本  # brave-rewrite puts this in front of the query
    brave_lang: {country: JP, search_lang: jp}
    domains: [.jp, nikkei.com, tabelog.com, jalan.net, kakaku.com, gurunavi.com, suumo.com, homes.com, livedoor.com, japan-guide.com, japanrailpass.net, jrailpass.com, tenki.jp, weathernews.jp]

