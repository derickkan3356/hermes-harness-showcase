  note: Link portal with almost no prose. Neither layer improves it.

- id: sina-news
  url: https://news.sina.com.cn/
  kind: mainland
  note: Large traditional news portal.

- id: xinhua
  url: https://www.xinhuanet.com/
  kind: mainland
  note: State news agency front page.

- id: chinanews
  url: https://www.chinanews.com.cn/
  kind: mainland
  note: Second mainland news source, different stack.

- id: zhihu
  url: https://www.zhihu.com/
  kind: mainland
  note: Aggressive bot detection. The layer 3 question is answered here.

- id: 36kr
  url: https://36kr.com/
  kind: mainland
  note: Tech news, client-rendered.

- id: weixin-portal
  url: https://mp.weixin.qq.com/
